      UN M49 geographic region.
      Source: https://unstats.un.org/unsd/methodology/m49/
    permissible_values:
      Africa:
      Americas:
      Asia:
      Europe:
      Oceania:

  UNRegionalGroup:
    description: Regional groups of United Nations member states
    permissible_values:
      African:
      Asia_Pacific:
      Eastern_European:
      GRULAC:
      WEOG:

