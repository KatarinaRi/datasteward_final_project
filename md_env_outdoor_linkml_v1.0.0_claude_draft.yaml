id: https://w3id.org/chemicalExposome/schema/chemicals-outdoor
name: chemicals-outdoor-schema
title: Metadata Schema for Data Concerning Chemicals in the Outdoor Environment
description: >-
  This schema defines metadata for describing collections of environmental
  samples and parameters measured in these samples, focusing on the occurrence
  of chemicals in the outdoor environment. Developed in PARC WP7 (P7.2.2a).
version: "1.3"
license: https://creativecommons.org/licenses/by/4.0/
see_also:
  - https://doi.org/10.5281/zenodo.17175075

prefixes:
  linkml: https://w3id.org/linkml/
  ceo: https://w3id.org/chemicalExposome/schema/chemicals-outdoor/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: ceo
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# SUBSETS
# ---------------------------------------------------------------------------
subsets:
  mandatory:
    description: Fields that are mandatory for all record types
  mandatory_for_monitoring:
    description: Fields mandatory only for monitoring programmes (optional for projects)
  mandatory_if_exists:
    description: Fields mandatory if the entity exists (e.g. campaign)

# ---------------------------------------------------------------------------
# TYPES
# ---------------------------------------------------------------------------
types:
  EmailAddress:
    uri: xsd:string
    base: str
    pattern: "^[\\w.+-]+@[\\w-]+\\.[\\w.]+$"
    description: A valid email address

  URIorCURIE:
    uri: xsd:anyURI
    base: str
    description: A URI or CURIE reference

  OrcidIdentifier:
    uri: xsd:string
    base: str
    pattern: "^\\d{4}-\\d{4}-\\d{4}-\\d{3}[\\dX]$"
    description: An ORCID identifier in the format 0000-0000-0000-0000

  RorIdentifier:
    uri: xsd:string
    base: str
    # TODO: tighten this pattern — ROR IDs have a fixed 9-character alphanumeric
    # format (e.g. ror.org/02mhbdp94). Current regex allows any length.
    pattern: "^ror\\.org/[a-z0-9]+"
    description: A ROR identifier in the format ror.org/xxxxxxxx

  DecimalDegree:
    uri: xsd:decimal
    base: float
    description: A decimal degree coordinate value

  YearValue:
    uri: xsd:gYear
    base: int
    description: A year value in YYYY format

# ---------------------------------------------------------------------------
# ENUMS
# ---------------------------------------------------------------------------
enums:

  MonitoringActivityType:
    description: Type of monitoring activity
    permissible_values:
      scientific_project:
        description: >-
          A time-limited initiative focused on collection, analysis, and
          interpretation of data to answer specific scientific questions.
      monitoring_programme:
        description: >-
          A systematic and long-term observation of specific parameters,
          organized based on legislative requirements.

  ImplementationLevel:
    description: The implementation level of coverage
    permissible_values:
      international:
      national:
      regional:
      local:

  ContactRole:
    description: >-
      Role of a contact person. Source: ISO 19115:2003/19139 and
      EC Regulation No 1205/2008 (INSPIRE).
    permissible_values:
      resourceProvider:
        description: Party that supplies the resource
      custodian:
        description: >-
          Party that accepts accountability and responsibility for the data
          and ensures appropriate care and maintenance of the resource
      owner:
        description: Party that owns the resource
      user:
        description: Party who uses the resource
      distributor:
        description: Party who distributes the resource
      originator:
        description: Party who created the resource
      pointOfContact:
        description: >-
          Party who can be contacted for acquiring knowledge about or
          acquisition of the resource
      principalInvestigator:
        description: >-
          Key party responsible for gathering information and conducting research
      processor:
        description: >-
          Party who has processed the data in a manner such that the resource
          has been modified
      publisher:
        description: Party who published the resource
      author:
        description: Party who authored the resource

  # TODO: This enum is a full placeholder. The final controlled vocabulary
  # for analytical methods is being developed separately within the PARC
  # project. Replace this stub once the PARC analytical methods vocabulary
  # is finalized.
  AnalysisMethod:
    description: >-
      Analytical method used to determine the analyte in the sample.
      NOTE: Placeholder only — final vocabulary pending.
    permissible_values:
      PLACEHOLDER:
        description: >-
          Placeholder value — final vocabulary pending.
          Do not use in production data.

  ConcentrationUnit:
    description: Units used for chemical concentration measurements
    # TODO: Review whether non-concentration units (m, cm, g, celsius,
    # m_s1, degrees, kPa, Qv_kg_kg, percent, unitless, meq_kg1, minus)
    # belong here or in a separate general UnitEnum. The current enum
    # mixes chemical concentration units with physical/meteorological units.
    permissible_values:
      ug_m3:
        description: Micrograms per cubic meter (µg m⁻³)
      ng_m3:
        description: Nanograms per cubic meter (ng m⁻³)
      mg_m3:
        description: Milligrams per cubic meter (mg m⁻³)
      pg_m3:
        description: Picograms per cubic meter (pg m⁻³)
      ng_m2:
        description: Nanograms per square meter (ng m⁻²)
      ug_m2:
        description: Micrograms per square meter (µg m⁻²)
      ng_mg1:
        description: Nanograms per milligram (ng mg⁻¹)
      ug_mg1:
        description: Micrograms per milligram (µg mg⁻¹)
      mg_kg1:
        description: Milligrams per kilogram (mg kg⁻¹)
      ng_g1:
        description: Nanograms per gram (ng g⁻¹)
      ug_g1:
        description: Micrograms per gram (µg g⁻¹)
      pg_g1:
        description: Picograms per gram (pg g⁻¹)
      ng_sample1:
        description: Nanograms per sample (ng sample⁻¹)
      pg_sample1:
        description: Picograms per sample (pg sample⁻¹)
      g_l1:
        description: Grams per liter (g l⁻¹)
      mg_l1:
        description: Milligrams per liter (mg l⁻¹)
      ug_l1:
        description: Micrograms per liter (µg l⁻¹)
      ng_l1:
        description: Nanograms per liter (ng l⁻¹)
      pg_l1:
        description: Picograms per liter (pg l⁻¹)
      ng_m2_d1:
        description: Nanograms per square meter per day (ng m⁻² d⁻¹)
      pg_m2_d1:
        description: Picograms per square meter per day (pg m⁻² d⁻¹)
      g_cm3:
        description: Grams per cubic centimeter (g cm⁻³)
      mg_dl:
        description: Milligrams per deciliter (mg/dl)
      ppb:
        description: Parts per billion
      ppm:
        description: Parts per million
      psu:
        description: Practical Salinity Units
      m3:
        description: Cubic meter
      m:
        description: Meter
      cm:
        description: Centimeter
      g:
        description: Gram
      celsius:
        description: Degrees Celsius (°C)
      m_s1:
        description: Meters per second (m/s)
      degrees:
        description: Degrees (wind direction)
      kPa:
        description: Kilopascal
      Qv_kg_kg:
        description: Water vapor mixing ratio (Qv, kg/kg)
      percent:
        description: Percentage (%)
      unitless:
        description: Dimensionless / unitless
      meq_kg1:
        description: Milliequivalents per kilogram (meq kg⁻¹)
      minus:
        description: Dimensionless ratio (-)

  CompoundGroup:
    description: >-
      Chemical group classification as used in the PARC WP9 compound list.
      Groups are based on chemical structure and/or regulatory relevance.
      # TODO: Future alignment planned with ChemFOnt functional ontology
      # (https://www.chemfont.ca/) and NORMAN SusDat groupings.
    permissible_values:
      PFAS:
        description: Per- and polyfluoroalkyl substances
      PCBs:
        description: Polychlorinated biphenyls
      PBDEs:
        description: Polybrominated diphenyl ethers
      PAHs:
        description: Polycyclic aromatic hydrocarbons
      OCPs:
        description: Organochlorine pesticides
      biocides:
        description: Biocidal substances
      pharmaceuticals:
        description: Pharmaceutical compounds and metabolites
      hormones:
        description: Natural and synthetic hormones
      heavy_metals:
        description: Heavy metals and metalloids
      dioxins_furans:
        description: Dioxins and furans (PCDD/PCDF)
      HBCDs:
        description: Hexabromocyclododecanes
      PFRs:
        description: Phosphorus flame retardants
      UV_filters:
        description: UV filters and stabilizers
      plasticizers:
        description: Plasticizers including phthalates
      siloxanes:
        description: Siloxanes and silicones
      musks:
        description: Synthetic and natural musks
      pesticides_other:
        description: Other pesticides not covered above
      other:
        description: Other compounds not classified above

  CoordinateSystem:
    description: Coordinate reference system used for geographic coordinates
    permissible_values:
      WGS84:
        description: Global coordinate system widely used for GPS navigation. EPSG:4326.

  WaterType:
    description: Type of water body
    permissible_values:
