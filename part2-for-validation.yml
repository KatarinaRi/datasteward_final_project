    required: true
    in_subset: 
      - mandatory_if # Mandatory for project/programme, institution, funder, site,
    # Optional for managing instance

  name_original:  
    range: string
    required: true
    description: >-
      Name of the entity in the original language of the 
      institution/site/project. Use the local official name.
    in_subset:
      - mandatory

  sample_id:
    description: Unique identifier for the sample
    range: string
    required: true
    identifier: true
    in_subset: 
      - mandatory
  
  site_id:
    description: >-
      Unique identifier of the monitoring site where the sample
      was collected. References the site_id of a Site record.
    range: string
    required: false
    in_subset:
      - mandatory_if

  site_name:
    description: >-
      Name of the monitoring site. Provide in the local language
      as the primary name. An English name may be added if available
      and commonly used. Multiple names in different languages are accepted.
    range: string
    required: false
    multivalued: true
    slot_uri: schema:name

  start_date:
    description: Start date in format YYYY-MM-DD
    range: date
    required: true
    in_subset: 
      - mandatory 

  end_date:
    description: End date in format YYYY-MM-DD
    range: date

  sampling_time_start:
    description: >-
      Sampling start time according to ISO 8601, 24-hour clock.
      Format T[hh][mm][ss].
    range: time

  sampling_time_end:
    description: Sampling end time according to ISO 8601.
    range: time

  email:
    description: >-
      Email address of the project contact point.
      Institutional email is recommended.
    range: EmailAddress
    required: true
    in_subset: 
      - mandatory 

  orcid:
    description: ORCID identifier of the contact person
    range: OrcidIdentifier

  ror:
    description: ROR identifier of the institution (format ror.org/xxxxxxxx)
    range: RorIdentifier

  link:
    description: URL with information about the institution
    range: IRI
  # Mandatory for Legislation/Policy; Optional for Project/Programme, Institution, Funder, Sample preparation method, analysis method, data handling procedure

  country:
    range: Country
    description: >-
      Country where the site, institution or project is located,
      according to ISO 3166-1 alpha-2 (two-letter uppercase code).
    required: true
    in_subset: 
      - mandatory

  unit:
    description: Unit of measurement
    range: Unit
    required: true
    in_subset: 
      - mandatory

  uncertainty: # TBC with domain experts 
    description: >-
      Measurement uncertainty of the concentration/paramter value,
      expressed as a percentage (%) at 95% confidence level.  
    range: double
    minimum_value: 0

# ---------------------------------------------------------------------------
# CLASSES
# ---------------------------------------------------------------------------
classes:
  # ---------------------------------------------------------------------------
  # PROJECT
  # ---------------------------------------------------------------------------
  MonitoringActivity: # Renamed from Project to Monitoring Activity to avoid ambiguity (as Project is type of monitoring activity)
    description: >-
      A research project or monitoring programme collecting environmental
      data on chemicals in the outdoor environment (air, water, sediment, soil, biota)
    slots:
      - name_en
      - name_original
      - acronym
    
    attributes:

      type:
        description: Type of monitoring activity
        range: MonitoringActivityType
        required: true
        in_subset:
          - mandatory

      activity_description:
        description: >-
          A brief summary with the most important details summarising the
          project (objectives, scope, target group, key aspects, design,
          methods).
        range: string
        required: true
        in_subset:
          - mandatory

      identifier:
        description: >-
          Project/monitoring programme identifier provided as URL (GUPRI).
          At least one identifier required.
        range: IRI
        multivalued: true

      monitoring_reasons:
        description: >-
          Primary reasons for performing monitoring (e.g. regulatory requirements). Mandatory for
          monitoring programmes; optional for projects if relevant.
        range: string
        in_subset:
          - mandatory_if # See the rule. Mandatory for monitoring programmes.

      legislation_policy:
        description: >-
          Link(s) to policy, convention, or legislation underpinning
          the monitoring activity. Mandatory for
          monitoring programmes; optional for projects if relevant. 
        range: IRI
        multivalued: true
        in_subset:
          - mandatory_if # See the rule. Mandatory for monitoring programmes.
           
      implementation_level:
        description: The geographic scale of the monitoring coverage (international, national, regional, or local).
        range: ImplementationLevel

      language: # Means in data? Or for communication in monitoring activity?
        description: >-
          Language(s) used, as 2-letter codes according to ISO 639-1.
        range: string
        multivalued: true

      start_date:
        description: >-
          The beginning (or previewed starting) date of the monitoring
          programme/project.
        range: date
        required: true
        in_subset:
          - mandatory

      end_date:
        description: End date of the project/monitoring programme.
        range: date
        required: false

      campaigns:
        range: Campaign      # Project HAS campaigns
        description: >-
          If an Environmental Monitoring Programme/Project has a long-term perspective of at least 
          a few years, it may be necessary to input data at suitable time intervals. For this time period, 
          is used the term "Campaign". A Campaign is defined by its start and end, and it is recommended 
          to name it within the project using a consistent style.
        multivalued: true    # 0..n
        inlined_as_list: true
      
      institutions: # Align contacts, funders and institution with DCAT-AP Agent?
        range: Institution
        multivalued: true        # multiple institutions possible
        required: true           # at least one required
        minimum_cardinality: 1   # 1..n
        inlined_as_list: true
        description: >-
          Institution(s) responsible for implementing the
          monitoring activity.
        in_subset:
          - mandatory

      contacts:
        range: Contact
        multivalued: true        # 0..n
        required: true           # at least one required
        minimum_cardinality: 1   # 1..n
        inlined_as_list: true
        description: >-
          Contact person(s) for the monitoring activity.
        in_subset:
          - mandatory
      
      funders:
        range: Funder
        multivalued: true        # 0..n
        required: false          
        inlined_as_list: true
        description: >-
          Funding entity/entities supporting the monitoring activity.

      # --- Access and rights ---
      access_procedures:
        description: Information on procedure to obtain access to the dataset.
        range: string
        required: true
        in_subset:
          - mandatory

      acknowledgement:
        description: >-
          Text for acknowledgement which should be reported when
          using/re-using the data.
        range: string
        required: true
        in_subset:
          - mandatory

      license:
        description: License or terms for data reuse.
        range: string
        required: true
        in_subset:
          - mandatory

      disclaimer:
        description: Text for disclaimer when using/re-using the data.
        range: string

      version:  # Not in the original schema
        description: Version of the dataset.
        range: string
        required: false

      publication_year: # Not in the original schema
        description: Year when the dataset was or will be made publicly available.
        range: integer
        required: false

      provenance: # Not in the original schema
        description: A statement about the lineage of the dataset.
        range: string
        required: false

  
    rules:
      - title: monitoring_reasons_required_for_monitoring_programme
        description: >-
          Monitoring reasons are mandatory when the monitoring activity type
          is a monitoring programme, as it is driven by legislative
          requirements that must be explicitly documented.
        preconditions:
          slot_conditions:
            type:
              equals_string: monitoring_programme
        postconditions:
          slot_conditions:
            monitoring_reasons:
              required: true
      - title: legislation_policy_required_for_monitoring_programme
        description: >-
          At least one link to legislation or policy is mandatory
          when the activity type is a monitoring programme.
        preconditions:
          slot_conditions:
            type:
              equals_string: monitoring_programme
        postconditions:
          slot_conditions:
            legislation_policy:
              required: true
              minimum_cardinality: 1


  # ---------------------------------------------------------------------------
  # CAMPAIGN (= importna davka in genasis, not necessarily in PARC)
  # ---------------------------------------------------------------------------
  Campaign:
    description: >-
      A time-bounded data collection period within a project or monitoring
      programme. Mandatory if the campaign exists.
    slots:
      - name_en
      - acronym
      - start_date
      - end_date
    slot_usage: 
      name_en: 
        required: true
        in_subset: 
          - mandatory_if
      acronym: 
        required: true
        in_subset: 
          - mandatory_if
      end_date:
        required: true
        in_subset: 
          - mandatory_if

    attributes:

      campaign_description:  # are there other description attributes? Make it a slot?
        description: Description of the campaign
        range: string


  # ---------------------------------------------------------------------------
  # INSTITUTION
  # ---------------------------------------------------------------------------
  Institution:
    description: >-
      An organisation or institution involved in the monitoring activity.
    slots:
      - name_en
      - name_original
      - acronym
      - ror
      - country
      - link

    attributes:
      institution_id: # Do we need it if ROR is used (in that case ROR must be made mandatory)?
        description: >-
          Unique institution id
        identifier: true
        range: string
        required: true

  # ---------------------------------------------------------------------------
  # CONTACT
  # ---------------------------------------------------------------------------
  Contact:
    description: >-
      A contact person associated with the monitoring activity.
    slots:
      - email
      - orcid
    attributes:
      contact_id:
        description: >-
          Unique contact ID
        identifier: true
        range: string
        required: true
      
      role:
        description: >-
          Role/function performed by the contact person. Source: ISO 19115:2003/19139 and
          EC Regulation No 1205/2008 (INSPIRE).
        range: Role
        required: false

      institution:
        description: >-
          Contact's institution
        range: Institution    # links contact to their institution
        required: false

  # ---------------------------------------------------------------------------
  # FUNDER
  # ---------------------------------------------------------------------------
  Funder:
    description: >-
      A funding entity supporting the monitoring activity.
    slots:
      - ror
      - name_en
      - name_original
      - link
    attributes:
      funder_id:
        description: >-
          Unique funder ID
        identifier: true
        range: string
        required: true

  
  # ---------------------------------------------------------------------------
  # SITE
  # ---------------------------------------------------------------------------
  
  Site:
    description: >-
      A monitoring site or location where samples are collected.
      Coordinates (latitude and longitude) are mandatory unless they cannot
      be provided for privacy, security or confidentiality reasons.
      When coordinates are provided, GIS-derived fields (NUTS3, land use,
      river basin, sea, soil type) can be automatically retrieved from
      GIS layers. When coordinates are not provided, expert-described
      location fields (country, geographic region, NUTS3) are required instead.
    slots:
      - acronym
      - country
      - site_id
      - site_name
      - link
    slot_usage:
      site_name: 
        required: true 
        identifier: true
        in_subset:
          - mandatory 
      country:
        multivalued: true
        description: >-
          Country code(s) according to ISO 3166-1 alpha-2. Extended with
          XX (unknown) and XZ (international waters).
        in_subset:
          - mandatory_if    # mandatory when coordinates not provided

    attributes:
      # --- Coordinate privacy exception ---
      coordinate_privacy_exception:
        range: boolean
        required: false
        ifabsent: "false"
        description: >-
          Set to true (value = true) if coordinates cannot be provided for privacy,
          security or confidentiality reasons. If true, expert location
          fields (country, geographic_region, nuts3) are required instead. 
          Optional - if not provided, it is assumed coordinates are not withheld for privacy reasons.

      coordinate_privacy_exception_reason:  # Not in original schema but because we want to encourage providing coordinates, I suggest to request this
        range: string
        required: false
        description: >-
          Justification for not providing coordinates. Required when
          coordinate_privacy_exception is true. Provide a brief explanation
          of the privacy, security or confidentiality reason that prevents
          disclosure of the exact site location.
        in_subset:
          - mandatory_if

      # --- Coordinates (mandatory unless privacy exception - see coordinate_privacy_exception attribute) ---
      latitude:
        range: DecimalDegree
        required: false
        minimum_value: -90
        maximum_value: 90
        description: >-
          Latitude in signed decimal degrees (format 0.000000, range -90 to 90).
          South latitude with minus sign. Coordinate reference system: WGS 84 (EPSG:4326).
          Mandatory unless coordinate_privacy_exception is true.
        in_subset:
          - mandatory_if

      longitude:
        range: DecimalDegree
        required: false
        minimum_value: -180
        maximum_value: 180
        description: >-
          Longitude in signed decimal degrees (format 0.000000, range -180 to 180).
          West longitude with minus sign. Coordinate reference system: WGS 84 (EPSG:4326).
          Mandatory unless coordinate_privacy_exception is true.
        in_subset:
          - mandatory_if

      coordinate_system:
        range: CoordinateSystem
        required: false
        description: >-
          Coordinate reference system used. Default is EPSG:4326 (WGS 84).
        in_subset:
          - mandatory_if    # mandatory when coordinates are provided

      # --- Mandatory if coordinates not provided: --- 
      geographic_region:
        range: GeographicRegion
        required: false
        description: UN M49 geographic region
        in_subset:
          - mandatory_if # Only if coordinates are not provided 

      regional_group:
        range: UNRegionalGroup
        required: false
        description: Regional group of United Nations member states
        in_subset: 
          - mandatory_if # Only if coordinates are not provided 

      nuts3:
        range: string
        pattern: "^[A-Z]{2}[A-Z0-9]{3,4}$"
        required: false
        description: >-
          NUTS3 region code according to the Eurostat NUTS classification
          (Nomenclature of Territorial Units for Statistics), level 3.
          Example: CZ080 (Moravskoslezsky kraj), DE300 (Berlin).
          If NUTS3 is not applicable (e.g. non-EU countries), use an
          alternative administrative classification.
        see_also:
          - http://data.europa.eu/nuts/
        in_subset:
          - mandatory_if  # Only if coordinates are not provided 

      # --- Other attributes ---
      year_established:
        range: YearValue
        required: false
        description: Year of establishment of the monitoring station (YYYY)

      site_description: # See comment for reference_to_site - why both? And both optional...
        range: string
        required: false
        description: >-
          Description of the site where samples were collected.
          Provide all important information that cannot be captured
          in other fields.

      managing_instance: # Align with Agent in DCAT-AP?
        range: Institution
        required: false
        description: The institution that manages the sampling site

      water_type:
        range: WaterType
        required: false
        description: Type of water body at the site. Only relevant for water and sediment sampling.

      water_geographical_feature:
        range: WaterGeographicalFeature
        required: false
        description: Geographical water feature type at the site. Only relevant for water and sediment sampling.

      water_treatment:
        range: WaterTreatment
        required: false
        description: Water treatment status at the site. Only relevant for water and sediment sampling.

      altitude: # Can be GIS-derived 
        range: double
        required: false
        description: >-
          Altitude in meters above sea level (MSL). Use positive values
          for above and negative for below sea level.
      
      land_use: # Can be GIS-derived 
        range: LandUse
        required: false
        description: >-
          Land use classification according to CORINE Land Cover nomenclature.
        see_also:
          - https://www.w3.org/2015/03/corine

      river_basin: # Can be GIS-derived 
        range: RiverBasin
        required: false
        description: >-
          River basin associated with the site, based on the EEA river
          basin districts dataset. Only relevant for water and sediment sampling.
        see_also:
          - https://www.eea.europa.eu/en/datahub/datahubitem-view/dc1b1cdf-5fa0-4535-8c89-10cc051e00db

      sea: # Can be GIS-derived 
        range: Sea
        required: false
        description: >-
          Sea or ocean associated with the site, based on the Marine
          Regions Gazetteer. Only relevant for water and sediment sampling.
        see_also:
          - https://www.marineregions.org

      soil_type: # Can be GIS-derived 
        range: SoilTypeWRB
        required: false
        description: >-
          World Reference Base for Soil Resources (WRB) 2006/2007
          Reference Soil Group at the site. Only relevant for soil sampling.
        see_also:
          - https://inspire.ec.europa.eu/codelist/WRBReferenceSoilGroupValue

  rules:
    # IF privacy exception absent > false -> coordinates required
      - title: coordinates_required_when_no_privacy_exception
        description: >-
          Coordinates are mandatory when coordinate_privacy_exception
          is false or not provided (defaults to false via ifabsent).
        preconditions:
          slot_conditions:
            coordinate_privacy_exception:
              equals_string: "false"
        postconditions:
          slot_conditions:
            latitude:
              required: true
            longitude:
              required: true

      # IF privacy exception = true -> reason and expert fields required
      - title: expert_fields_required_when_coordinates_withheld
        description: >-
          When coordinates cannot be provided for privacy or confidentiality
          reasons, a justification and expert location fields must be provided.
        preconditions:
          slot_conditions:
            coordinate_privacy_exception:
              equals_string: "true"
        postconditions:
          slot_conditions:
            coordinate_privacy_exception_reason:
              required: true
            country:
              required: true
            geographic_region:
              required: true
            nuts3:
              required: true
            regional_group:
              required: true