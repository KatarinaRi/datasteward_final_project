  # Country: Map to: https://op.europa.eu/en/web/eu-vocabularies/dataset/-/resource?uri=http://publications.europa.eu/resource/dataset/country
  # UN Stats does not publish countries vocabulary as linked data.
  # The UN Statistics Division publishes M49 only as a webpage, CSV/Excel downloads, and PDF
  # not as an RDF/SKOS vocabulary with persistent URIs. This is explicitly noted in the 
  # OMG LCC specification: the ISO and UN codes have not been published by those organizations as RDF vocabularies to date.
  # But there's a gap-filler: The Object Management Group (OMG) Languages, Countries and Codes (LCC)
  #  standard was specifically designed to fill this gap. It publishes both ISO 3166 and UN M49 as proper OWL ontologies with persistent URIs.
  Country:
    description: >-
      Country codes according to ISO 3166-1 alpha-2 (two-letter uppercase codes).
      URIs from OMG Languages, Countries and Codes (LCC) ontology, which provides
      the authoritative linked data representation of ISO 3166-1 since neither
      ISO nor UN Statistics Division publish official RDF vocabularies.
    see_also:
      - https://www.iso.org/iso-3166-country-codes.html
      - https://www.omg.org/spec/LCC/Countries/ISO3166-1-CountryCodes/
      - https://unstats.un.org/unsd/methodology/m49/
