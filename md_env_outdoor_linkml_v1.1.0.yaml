id: https://w3id.org/chemical-exposome/schema/chemicals-outdoor
name: chemicals-outdoor-schema
title: Metadata Schema for Data Concerning Chemicals in the Outdoor Environment
description: >-
  This metadata schema represents the minimum metadata community standard for reporting data concerning 
  the occurrence of chemicals in the outdoor environment (environmental monitoring data) as discussed and agreed upon 
  by the European Partnership for the Assessment of Risks from Chemicals. The schema contains metadata elements and associated codelists
  to describe a project or monitoring programme that generated the data, elements to describe the monitoring site, sample, 
  concentration and other parameters, and the associated codelists. Atmospheric, terrestrial, and aquatic environments, 
  as well as in biota, are covered.
version: "1.1.0"
license: https://creativecommons.org/licenses/by/4.0/ # TBC
see_also: 
  - https://doi.org/10.5281/zenodo.17175075 # yaml list syntax

prefixes:
  linkml: https://w3id.org/linkml/
  cenvo: https://w3id.org/chemical-exposome/schema/chemicals-outdoor/ # as Chemical Exposome ENVironmental monitoring Outdoor
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: cenvo
default_range: string # Defining the default_range comes with pros and cons. See the documentation.

imports:
  - linkml:types # Consider splitting the schema into multiple files and import them - see the documentation

# ---------------------------------------------------------------------------
# SUBSETS
# Subsets have been changed to mandatory (optional are default by link-ML unless required: true)
# and mandatory_if - fields required conditionally (further specified by rules).
# ---------------------------------------------------------------------------
subsets:
  mandatory:
    description: Fields that are required for all record types.
  mandatory_if:
    description: Fields that are required conditionally - see class rules for details

# ---------------------------------------------------------------------------
# TYPES
# ---------------------------------------------------------------------------
types:
  EmailAddress:
    uri: xsd:string
    base: str
    pattern: "^[\\w.+-]+@[\\w-]+\\.[\\w.]+$"
    description: A valid email address

  IRI:
    uri: xsd:anyURI # xsd:anyURI is echnically defined for URIs (ASCII only) per XML Schema spec, but in practice, most tools (including LinkML, RDF, OWL) treat xsd:anyURI as accepting IRIs too.
    base: str
    description: An Internationalized Resource Identifier (IRI). All URIs are valid IRIs, so both URI and IRI values are accepted.

  OrcidIdentifier:
    uri: xsd:string
    base: str
    pattern: "^\\d{4}-\\d{4}-\\d{4}-\\d{3}[\\dX]$"
    description: An ORCID identifier in the format 0000-0000-0000-0000

  RorIdentifier:
    uri: xsd:string
    base: str
    pattern: "^ror\\.org/[a-z0-9]{9}$"
    description: A ROR identifier in the format ror.org/xxxxxxxxx

  DecimalDegree:
    uri: xsd:decimal
    base: double
    description: A decimal degree coordinate value

  YearValue:
    uri: xsd:gYear
    base: int
    description: A year value in YYYY format

# ---------------------------------------------------------------------------
# ENUMS
# ---------------------------------------------------------------------------
enums:

  MonitoringActivityType:
    description: Type of monitoring activity
    permissible_values:
      scientific_project:
        description: >-
          Usually a time-limited initiative focused on the collection, 
          analysis, and interpretation of data to answer specific scientific 
          questions in the field of environmental studies. These projects are 
          led by scientists and aim at advancing knowledge, verifying hypotheses, 
          or testing new methodologies. Data collected in research projects 
          are driven by the pursuit of scientific understanding rather than 
          by legislative requirements.
      monitoring_programme:
        description: >-
          A systematic and long-term observation of specific parameters, 
          organized based on legislative requirements. The purpose 
          of a monitoring programme is to collect data necessary for assessing 
          the state or trends of the environment and to ensure compliance with 
          regulatory standards. Its primary motivation is fulfilling obligations 
          set by laws, directives, or international agreements.

  ImplementationLevel:
    description: >-
      The geographic scale of the monitoring coverage 
      (e.g. international, national, regional, or local).
    permissible_values:
      international:
      national:
      regional:
      local:

