        description: Practical Salinity Units
      m3:
        description: Cubic meter (m3)
      m:
        description: Meter (m)
      cm:
        description: Centimeter (cm)
      g:
        description: Gram (g)
      celsius:
        description: Degrees Celsius (deg C)
      m_s1:
        description: Meters per second (m/s)
      degrees:
        description: Degrees (wind direction)
      kPa:
        description: Kilopascal (kPa)
      Qv_kg_kg:
        description: Water vapor mixing ratio (Qv, kg/kg)
      percent:
        description: Percentage (%)
      unitless:
        description: Dimensionless or unitless
      meq_kg1:
        description: Milliequivalents per kilogram (meq/kg)
      minus:
        description: Dimensionless ratio (-)
      kg_kg:
        description: Kilograms per kilogram — water vapor mixing ratio (kg/kg)
      um:
        description: Micrometer (um) — used for particle size granularity

  CompoundGroup:
    description: >-
      Chemical group classification as used in the PARC WP9 compound list.
      Groups are based on chemical structure and/or regulatory relevance.
      # TODO: Future alignment planned with ChemFOnt functional ontology
      # (https://www.chemfont.ca/). Also check with OECD recommendation for grouping of chemicals.
    permissible_values:
      PFAS:
        description: Per- and polyfluoroalkyl substances
      PCBs:
        description: Polychlorinated biphenyls
      PBDEs:
        description: Polybrominated diphenyl ethers
      PAHs:
        description: Polycyclic aromatic hydrocarbons
      OCPs:
        description: Organochlorine pesticides
      biocides:
        description: Biocidal substances
      pharmaceuticals:
        description: Pharmaceutical compounds and metabolites
      hormones:
        description: Natural and synthetic hormones
      heavy_metals:
        description: Heavy metals and metalloids
      dioxins_furans:
        description: Dioxins and furans (PCDD/PCDF)
      HBCDs:
        description: Hexabromocyclododecanes
      PFRs:
        description: Phosphorus flame retardants
      UV_filters:
        description: UV filters and stabilizers
      plasticizers:
        description: Plasticizers including phthalates
      siloxanes:
        description: Siloxanes and silicones
      musks:
        description: Synthetic and natural musks
      pesticides_other:
        description: Other pesticides not covered above
      other:
        description: Other compounds not classified above

  Parameter:
    description: >-
      Parameters measured alongside chemical concentrations in environmental
      samples or at site. Covers air, water, sediment, soil and biota matrices.
      The applicable environment is indicated in each parameter description.
    permissible_values:
      # --- Air parameters ---
      volume:
        description: Volume of sample collected (air; m3)
      height:
        description: Height of measurement (air; m)
      PM10:
        description: Particulate Matter 10 (air; ug/m3)
      PM10_2m:
        description: Particulate Matter 10 at 2m height (air; ug/m3)
      PM25:
        description: Particulate Matter 2.5 (air; ug/m3)
      NO2:
        description: NO2 concentration — height not specified (air; ug/m3)
      NO2_1_5m:
        description: NO2 measured at 1.5m height (air; ug/m3)
      wind_speed:
        description: Wind speed (air; m/s)
      wind_direction:
        description: Wind direction (air; degrees)
      sea_level_pressure:
        description: Sea level pressure (air; kPa)
      dew_point_temperature:
        description: Dew point temperature (air; deg C)
      water_vapor_mixing_ratio:
        description: Water vapor mixing ratio (air; kg/kg)
      # --- Water parameters ---
      depth_from:
        description: Depth from which the sample was collected (water; m)
      depth_to:
        description: Depth to which the sample was collected (water; m)
      depth:
        description: Depth of the sample (water; m)
      salinity:
        description: Salinity (water; PSU)
      pH:
        description: pH (water, soil, sediment; dimensionless)
      dissolved_inorganic_carbon:
        description: Dissolved inorganic carbon (water; ng/l)
      dissolved_organic_carbon:
        description: Dissolved organic carbon (water; ng/l)
      total_inorganic_carbon:
        description: Total inorganic carbon (water; ng/l)
      total_dissolved_solids:
        description: Total dissolved solids (water; mg/l)
      ions_chlorides:
        description: Chloride ions (water; mg/l)
      ions_hydrogencarbonates:
        description: Hydrogencarbonate ions (water; mg/l)
      ions_sulphates:
        description: Sulphate ions (water; mg/l)
      ions_Al:
        description: Aluminium cation (water; ug/l)
      ions_Ba:
        description: Barium cation (water; ug/l)
      ions_Ca:
        description: Calcium cation (water; mg/l)
      ions_Fe:
        description: Iron cation (water; ug/l)
      ions_K:
        description: Potassium cation (water; mg/l)
      ions_Mg:
        description: Magnesium cation (water; mg/l)
      ions_Mn:
        description: Manganese cation (water; ug/l)
      ions_Na:
        description: Sodium cation (water; mg/l)
      # --- Sediment parameters ---
      sample_depth_from:
        description: Sample depth from (sediment, soil; cm)
      sample_depth_to:
        description: Sample depth to (sediment, soil; cm)
      dry_mass:
        description: Dry mass (sediment; %)
      sil_Al2O3:
        description: Silicate Al2O3 (sediment; %)
      sil_CaO:
        description: Silicate CaO (sediment; %)
      sil_Co2:
        description: Silicate CO2 (sediment; %)
      sil_Fe2O3:
        description: Silicate Fe2O3 (sediment; %)
      sil_K2O:
        description: Silicate K2O (sediment; %)
      sil_Li2O:
        description: Silicate Li2O (sediment; %)
      sil_MgO:
        description: Silicate MgO (sediment; %)
      sil_MnO:
        description: Silicate MnO (sediment; %)
      sil_Na2O:
        description: Silicate Na2O (sediment; %)
      sil_P2O5:
        description: Silicate P2O5 (sediment; %)
      sil_SiO2:
        description: Silicate SiO2 (sediment; %)
      sil_SO3:
        description: Silicate SO3 (sediment; %)
      sil_TiO2:
        description: Silicate TiO2 (sediment; %)
      sil_combined_water:
        description: Silicate combined water (sediment; %)
      sil_ignition_loss:
        description: Silicate ignition loss (sediment; %)
      # --- Soil parameters ---
      absorbency:
        description: Absorbency (soil; %)
      airiness:
        description: Airiness (soil; %)
      capillar_capacity:
        description: Capillar capacity (soil; %)
      humidity:
        description: Humidity (soil; %)
      minimum_air_capacity:
        description: Minimum air capacity (soil; %)
      porosity:
        description: Porosity (soil; %)
      volume_mass:
        description: Volume mass (soil; g/cm3)
      volume_mass_reduced:
        description: Volume mass reduced (soil; g/cm3)
      dissolved_organic_compounds:
        description: Dissolved organic compounds (soil; %)
      fulvic_acids:
        description: Fulvic acids (soil; %)
      humic_acids:
        description: Humic acids (soil; %)
      HA_FA:
        description: HA/FA ratio (soil; dimensionless)
      Q4_6:
        description: Q4/6 ratio (soil; dimensionless)
      saturation:
        description: Saturation (soil; %)
      total_carbonates:
        description: Total carbonates (soil; %)
      total_nitrogen:
        description: Total nitrogen (soil; %)
      granularity_clay_1_10um:
        description: Granularity clay 1-10 um (soil; %)
      granularity_clay_lt1um:
        description: Granularity clay < 1 um (soil; %)
      granularity_clay_lt2um:
        description: Granularity clay < 2 um (soil; %)
      granularity_clay_lt6um:
        description: Granularity clay < 6 um (soil; %)
      granularity_clay_lt10um:
        description: Granularity clay < 10 um (soil; %)
      granularity_silt_10_50um:
        description: Granularity silt 10-50 um (soil; %)
      granularity_sand_50_100um:
        description: Granularity sand 50-100 um (soil; %)
      granularity_sand_100_2000um:
        description: Granularity sand 100-2000 um (soil; %)
      granularity_sand_50_250um:
        description: Granularity sand 50-250 um (soil; %)
      granularity_sand_250_2000um:
        description: Granularity sand 250-2000 um (soil; %)
      pH_CaCl2:
        description: pH in CaCl2 solution (soil; dimensionless)
      pH_H2O:
        description: pH in water (soil; dimensionless)
      pH_KCl:
        description: pH in KCl solution (soil; dimensionless)
      # --- Shared sediment and soil parameters ---
      total_organic_carbon:
        description: Total organic carbon (sediment, soil; %)
      cec:
        description: Cation exchange capacity (CEC) (sediment, soil; meq/kg)
      cec_t:
        description: Total (Effective) Cation Exchange Capacity (CEC) (soil; meq/kg)
      cec_Meh_Ca:
        description: Exchangeable calcium extracted by Mehlich method (sediment, soil; meq/kg)
      cec_Meh_H:
        description: Exchangeable hydrogen extracted by Mehlich method (sediment, soil; meq/kg)
      cec_Meh_K:
        description: Exchangeable potassium extracted by Mehlich method (sediment, soil; meq/kg)
      cec_Meh_Mg:
        description: Exchangeable magnesium extracted by Mehlich method (sediment, soil; meq/kg)
      cec_Meh_P:
        description: Extractable phosphorus extracted by Mehlich method (soil; meq/kg)
      cec_exchange_Al:
        description: Exchangeable aluminium fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_Ca:
        description: Exchangeable calcium fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_Fe:
        description: Exchangeable iron fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_K:
        description: Exchangeable potassium fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_Mg:
        description: Exchangeable magnesium fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_Mn:
        description: Exchangeable manganese fraction of cation exchange capacity (soil; meq/kg)
      cec_exchange_Na:
        description: Exchangeable sodium fraction of cation exchange capacity (soil; meq/kg)
      # --- Shared air and water parameters ---
      temperature:
        description: Temperature (air, water; deg C)
      sample_weight:
        description: Weight of sample (air ug/m3; water g/l)
      # --- Biota parameters ---
      creatinine:
        description: Creatinine (biota; mg/dl)
      specific_gravity:
        description: Specific gravity (biota; dimensionless)
      dry_weight:
        description: Dry weight (biota; g)
      wet_weight:
        description: Wet weight (biota; g)
      lipid_weight:
        description: Lipid weight — tissue lipid content (biota; g)
      # --- Density ---
      density:
        description: Density (soil; g/cm3)

  # ChemicalCompound: Placeholder. The list of 1500 compounds will be held separately and 
  # this schema will point to it.
  ChemicalCompound:
      description:
      permissible_values:
        PLACEHOLDER:

# ---------------------------------------------------------------------------
# SLOTS (shared)
# ---------------------------------------------------------------------------

slots:

  taxon_name:
    range: string
    description: >-
      Scientific name of the taxon (genus, species or higher rank)
      as accepted in the GBIF Backbone Taxonomy.
    see_also:
      - https://www.gbif.org/species/search

  taxon_id:
    range: integer
    description: >-
      GBIF species key (integer). Resolves to
      https://www.gbif.org/species/{taxon_id}
    see_also:
      - https://www.gbif.org/species/search

  taxon_rank:
    range: TaxonRankEnum
    description: Taxonomic rank of the identified taxon.
    see_also:
      - https://www.gbif.org/developer/species#rank
  nuts3:
    range: string
    pattern: "^[A-Z]{2}[A-Z0-9]{3,4}$"
    description: >-
      NUTS3 region code according to the Eurostat NUTS classification 
      (Nomenclature of Territorial Units for Statistics), level 3.
      Example: CZ080 (Moravskoslezský kraj), DE300 (Berlin).
    see_also:
      - http://data.europa.eu/nuts/
    in_subset:
      - optional

  acronym:
    description: Short name or acronym of the project/monitoring programme
    range: string
    required: true
    identifier: true
    in_subset:
      - mandatory

  site_name:
    description: Name or designation of place where a sample was collected
    range: string
    required: true

  sample_id:
    description: Unique identifier for the sample
    range: string
    required: true
    identifier: true

  start_date:
    description: Start date in format YYYY-MM-DD
    range: date
    required: true

  end_date:
    description: End date in format YYYY-MM-DD
    range: date
    required: false

  sampling_date_start:
    description: >-
      The date of a one-time sample collection; for sampling occurring over
      a longer period, specify the starting day of the sampling period.
      Format YYYY-MM-DD.
    range: date
    required: true

  sampling_date_end:
    description: >-
      For sampling occurring over a longer period, specify the ending date
      of the sampling period. Format YYYY-MM-DD.
    range: date
    required: false

  sampling_time_start:
    description: >-
      Sampling start time according to ISO 8601, 24-hour clock.
      Format T[hh][mm][ss].
    range: time
    required: false

  sampling_time_end:
    description: Sampling end time according to ISO 8601.
    range: time
    required: false

  email:
    description: >-
      Email address of the project contact point.
      Institutional email is recommended.
    range: EmailAddress
    required: true

  orcid:
    description: ORCID identifier of the contact person
    range: OrcidIdentifier
    required: false

  ror:
    description: ROR identifier of the institution (format ror.org/xxxxxxxx)
    range: RorIdentifier
    required: false

  institution_name:
    description: >-
      The name of the institution responsible for implementing the
      project/monitoring programme
    range: string
    required: true

  institution_abbreviation:
    description: Abbreviation of the institution name
    range: string
    required: false

  institution_link:
    description: URL with information about the institution
    range: URIorCURIE
    required: false

  country:
    description: >-
      Country code according to UN M49 standard.
      Source: https://unstats.un.org/unsd/methodology/m49/
    range: string
    required: true

  unit:
    # TODO: Decide whether this shared slot should be typed to ConcentrationUnit
    # enum or remain free-text. MeasurementConcentration already references
    # ConcentrationUnit — keeping this as string allows broader use in
    # MeasurementParameter but loses validation on concentration records.
    description: Unit of measurement
    range: string
    required: true

  uncertainty:
    description: Measurement uncertainty
    range: double
    required: false

  water_type:
    description: Type of water body at the site
    range: WaterType
    required: false

  water_geographical_feature:
    description: Geographical water feature type
    range: WaterGeographicalFeature
    required: false

  water_treatment:
    description: Water treatment status
    range: WaterTreatment
    required: false

# ---------------------------------------------------------------------------
# CLASSES
# ---------------------------------------------------------------------------
classes:

  # ---------------------------------------------------------------------------
  # CHEMICAL COMPOUND (codelist entity)
  # ---------------------------------------------------------------------------
  
  classes:
  ParameterMeasurement:
    description: >-
      A single parameter measurement associated with a sample.
    attributes:
      parameter:
        range: AirParameter   # or whichever enum
        required: true
      value:
        range: double
        required: true
      unit:
        range: UnitEnum
        required: true
      meteorological_information_source:
        range: string
        required: false
        description: >-
          Source of meteorological information 
          (e.g. nearest weather station, model name, dataset reference).
    rules:
      - preconditions:
          slot_conditions:
            parameter:
              equals_string: meteorological_information_source
        postconditions:
          slot_conditions:
            meteorological_information_source:
              required: true
  
  
  
  ChemicalCompound:
    description: >-
      A chemical compound monitored in environmental samples.
      The compound list (1500+ substances) was developed in PARC WP9
      in collaboration with other WPs. Each compound is identified by
      multiple persistent identifiers and assigned to a compound group.
      See: https://doi.org/10.5281/zenodo.17175075
    see_also:
      - https://doi.org/10.1186/s13321-025-01092-3
    attributes:

      wp9_id:
        description: >-
          Internal PARC WP9 identifier for the compound.
          Unique within the PARC compound list.
        range: integer
        required: true
        identifier: true

      compound_name:
        description: >-
          Common or abbreviated name of the compound
          as used in the PARC community (e.g. PFOS, triclosan).
        range: string
        required: true
        in_subset:
          - mandatory

      compound_group:
        description: >-
          Chemical group classification of the compound
          as defined in the PARC WP9 compound list
          (e.g. PFAS, biocides, PCBs, PAHs).
          # TODO: Future alignment planned with ChemFOnt functional classes
          # and/or C3PO (ChEBI Chemical Class Program Ontology)
        range: CompoundGroup
        required: false

      cas_number:
        description: >-
          CAS Registry Number — unique numerical identifier
          assigned by the Chemical Abstracts Service.
          Format: NNNNNN-NN-N
        range: string
        required: false
        pattern: "^\\d{2,7}-\\d{2}-\\d$"

      ec_number:
        description: >-
          EC Number (European Community Number) — identifier used
          in the ECHA substance inventory (EINECS, ELINCS, NLP).
          Format: NNN-NNN-N
        range: string
        required: false
        pattern: "^\\d{3}-\\d{3}-\\d$"

      inchi:
        description: >-
          IUPAC International Chemical Identifier (InChI) —
          a standard textual representation of the molecular structure.
          Begins with 'InChI=1S/'.
        range: string
        required: false
        pattern: "^InChI=1S/"

      inchikey:
        description: >-
          InChIKey — a fixed-length (27-character) hash of the InChI string.
          Used as a compact, web-searchable identifier.
          Format: XXXXXXXXXXXXXX-XXXXXXXXXX-X
        range: string
        required: false
        pattern: "^[A-Z]{14}-[A-Z]{10}-[A-Z]$"

      chebi_id:
        description: >-
          ChEBI identifier for the compound.
          To be populated by mapping from InChIKey to ChEBI.
          Format: CHEBI:NNNNN
        range: URIorCURIE
        required: false

      pubchem_cid:
        description: >-
          PubChem Compound ID (CID).
          To be populated by mapping from InChIKey to PubChem.
        range: integer
        required: false

      norman_id:
        description: >-
          NORMAN substance identifier.
          Source: NORMAN EMPODAT / SusDat database.
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # PROJECT
  # ---------------------------------------------------------------------------
  Project:
    description: >-
      A research project or monitoring programme collecting environmental
      data on chemicals in the outdoor environment.
    slots:
      - acronym
    attributes:

      activity_type:
        description: Type of monitoring activity
        range: MonitoringActivityType
        required: true
        in_subset:
          - mandatory

      name_english:
        description: Name of the project/monitoring programme in English
        range: string
        required: true
        in_subset:
          - mandatory

      name_original:
        description: >-
          Name of the project/monitoring programme in its original language.
        range: string
        required: true
        in_subset:
          - mandatory

      description:
        description: >-
          A brief summary with the most important details summarising the
          project (objectives, scope, target group, key aspects, design,
          methods).
        range: string
        required: true
        in_subset:
          - mandatory

      identifier:
        description: >-
          Project/monitoring programme identifier provided as URL (GUPRI).
          At least one identifier required.
        range: URIorCURIE
        required: false
        multivalued: true

      monitoring_reasons:
        description: >-
          Primary reasons for performing monitoring. Mandatory for
          monitoring programmes; optional for projects if relevant.
        range: string
        required: false
        in_subset:
          - mandatory_for_monitoring

      legislation_policy:
        description: >-
          Link to policy, convention, or legislation. Mandatory for
          monitoring programmes; optional for projects if relevant.
        range: URIorCURIE
        required: false
        multivalued: true
        in_subset:
          - mandatory_for_monitoring

      implementation_level:
        description: The implementation level of coverage
        range: ImplementationLevel
        required: false

      language:
        description: >-
          Language(s) used, as 2-letter codes according to ISO 639-1.
        range: string
        required: false
        multivalued: true

      start_date:
        description: >-
          The beginning (or previewed starting) date of the monitoring
          programme/project.
        range: date
        required: true
        in_subset:
          - mandatory

      end_date:
        description: End date of the project/monitoring programme.
        range: date
        required: false

        classes:

  Campaign:
    rules:
      - preconditions:
          slot_conditions:
            campaign_id:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            campaign_name:
              required: true
            start_date:
              required: true

      # --- Institution (primary) ---
      institution_name:
        range: string
        required: true

      institution_abbreviation:
        range: string
        required: false

      institution_ror:
        description: ROR identifier (format ror.org/xxxxxxxx).
        range: RorIdentifier
        required: false

      country_of_institution:
        description: Country of institution according to UN M49
        range: string
        required: true

      institution_link:
        range: URIorCURIE
        required: false

      # --- Contact (primary) ---
      contact_email:
        description: Email address of the project contact point.
        range: EmailAddress
        required: true

      contact_role:
        description: >-
          Role of the contact person.
          Source: ISO 19115:2003/19139 and INSPIRE.
        range: ContactRole
        required: false

      contact_orcid:
        description: ORCID identifier of the contact.
        range: OrcidIdentifier
        required: false

      # --- Funder (primary) ---
      funder_name:
        description: Name of the funding entity.
        range: string
        required: false

      funder_uri:
        description: ROR identifier or website URL of the funding entity.
        range: URIorCURIE
        required: false

      # --- Access and rights ---
      access_procedures:
        description: Information on procedure to obtain access to the dataset.
        range: string
        required: true
        in_subset:
          - mandatory

      acknowledgement:
        description: >-
          Text for acknowledgement which should be reported when
          using/re-using the data.
        range: string
        required: true
        in_subset:
          - mandatory

      license:
        description: License or terms for data reuse.
        range: string
        required: true
        in_subset:
          - mandatory

      disclaimer:
        description: Text for disclaimer when using/re-using the data.
        range: string
        required: false

      version:
        description: Version of the dataset.
        range: string
        required: false

      publication_year:
        description: Year when the dataset was or will be made publicly available.
        range: integer
        required: false

      provenance:
        description: A statement about the lineage of the dataset.
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # CAMPAIGN
  # ---------------------------------------------------------------------------
  Campaign:
    description: >-
      A time-bounded data collection period within a project or monitoring
      programme. Mandatory if the campaign exists.
    slots:
      - acronym
    attributes:

      campaign_name:
        description: Name of the campaign
        range: string
        required: true
        in_subset:
          - mandatory_if_exists

      start_date:
        description: Start date of the campaign
        range: date
        required: true
        in_subset:
          - mandatory_if_exists

      end_date:
        description: End date of the campaign
        range: date
        required: true
        in_subset:
          - mandatory_if_exists

      campaign_description:
        description: Description of the campaign
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # INSTITUTION (additional)
  # ---------------------------------------------------------------------------
  Institution:
    description: >-
      An institution involved in the project/monitoring programme.
      Used for additional institutions beyond the primary one in Project.
    slots:
      - acronym
    attributes:

      name:
        range: string
        required: true
        in_subset:
          - mandatory

      name_abbreviation:
        range: string
        required: false

      institutional_ror:
        range: RorIdentifier
        required: false

      country:
        description: Country of institution according to UN M49
        range: string
        required: true
        in_subset:
          - mandatory

      link:
        range: URIorCURIE
        required: false

  # ---------------------------------------------------------------------------
  # CONTACT (additional)
  # ---------------------------------------------------------------------------
  Contact:
    description: >-
      A contact person associated with the project/monitoring programme.
      Used for additional contacts beyond the primary one in Project.
    slots:
      - acronym
      - email
      - orcid
    attributes:

      role:
        description: Role of the contact person
        range: ContactRole
        required: false

  # ---------------------------------------------------------------------------
  # FUNDER (additional)
  # ---------------------------------------------------------------------------
  Funder:
    description: >-
      A funding entity for the project/monitoring programme.
      Used for additional funders beyond the primary one in Project.
    slots:
      - acronym
    attributes:

      funder_name:
        range: string
        required: true
        in_subset:
          - mandatory

      funder_uri:
        description: ROR identifier or website URL of the funding entity.
        range: URIorCURIE
        required: false

  # ---------------------------------------------------------------------------
  # SITE GIS
  # ---------------------------------------------------------------------------
  SiteGIS:
    description: >-
      A sampling site defined by geographic coordinates (latitude and
      longitude), allowing automatic retrieval of site parameters via
      GIS layers.
    slots:
      - acronym
      - site_name
      - water_type
      - water_geographical_feature
      - water_treatment
    attributes:

      site_name_acronym:
        description: Short acronym for the site name. Max 10 characters, no spaces.
        range: string
        required: false

      latitude:
        description: >-
          Latitude in signed decimal degrees, format 0.000000,
          range -90 to 90. South latitude with minus sign.
        range: DecimalDegree
        required: true
        in_subset:
          - mandatory
        minimum_value: -90
        maximum_value: 90

      longitude:
        description: >-
          Longitude in signed decimal degrees, format 0.000000,
          range -180 to 180. West longitude with minus sign.
        range: DecimalDegree
        required: true
        in_subset:
          - mandatory
        minimum_value: -180
        maximum_value: 180

      coordinate_system:
        description: Coordinate reference system
        range: CoordinateSystem
        required: true
        in_subset:
          - mandatory

      year_established:
        description: Year of establishment of the station (YYYY)
        range: YearValue
        required: false

      site_id:
        description: Persistent identifier for the site
        range: string
        required: false

      reference_to_site:
        description: URL or other reference to description of sampling site
        range: URIorCURIE
        required: false

      description:
        description: >-
          Describe in English the site where a sample was collected.
          Provide all important information about the site that cannot
          be entered in the other fields.
        range: string
        required: false

      managing_instance:
        description: The institution that manages the sampling site
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # SITE EXPERT
  # ---------------------------------------------------------------------------
  SiteExpert:
    description: >-
      A sampling site described by expert knowledge, for cases where
      coordinates are unavailable.
    slots:
      - acronym
      - site_name
      - water_type
      - water_geographical_feature
      - water_treatment
    attributes:

      site_name_acronym:
        range: string
        required: false

      year_established:
        range: YearValue
        required: false

      site_id:
        range: string
        required: false

      reference_to_site:
        range: URIorCURIE
        required: false

      description:
        range: string
        required: false

      managing_instance:
        range: string
        required: false

      country:
        description: >-
          Country code(s) according to UN M49. Extended with
          'International waters' and 'Unknown or unspecified country'.
        range: string
        required: true
        multivalued: true
        in_subset:
          - mandatory

      geographic_region:
        description: UN M49 geographic region
        range: GeographicRegion
        required: true
        in_subset:
          - mandatory

      regional_group:
        description: Regional group of United Nations member states
        range: UNRegionalGroup
        required: true
        in_subset:
          - mandatory

      nuts3:
        description: >-
          NUTS3 classification. If not available, use alternative
          classification (e.g. US Counties).
          Source: https://ec.europa.eu/eurostat/web/nuts
        range: string
        required: true
        in_subset:
          - mandatory

      altitude:
        description: >-
          Altitude in meters above sea level (MSL). Use positive values
          for above and negative for below sea level.
        range: double
        required: false

      land_use:
        description: >-
          Land use classification according to Corine Land Cover
          Nomenclature. https://www.w3.org/2015/03/corine
        range: string
        required: false

      river_basin:
        description: >-
          River basin code. Based on EEA system.
          https://www.eea.europa.eu
        range: string
        required: false

      sea:
        description: >-
          Sea name. Based on Marine Regions system.
          https://www.marineregions.org
        range: string
        required: false

      wrb:
        description: >-
          World Reference Base for Soil Resources classification.
          https://inspire.ec.europa.eu/codelist/WRBReferenceSoilGroupValue
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # SAMPLE (abstract base)
  # ---------------------------------------------------------------------------
  Sample:
    description: Abstract base class for all sample types
    abstract: true
    slots:
      - site_name
      - sample_id
      - sampling_date_start
      - sampling_date_end
      - sampling_time_start
      - sampling_time_end

  # ---------------------------------------------------------------------------
  # SAMPLE ATMOSPHERIC
  # ---------------------------------------------------------------------------
  SampleAtmospheric:
    is_a: Sample
    description: A sample from the atmospheric domain (ambient air or precipitation)
    attributes:

      matrix:
        range: AtmosphericMatrix
        required: true
        in_subset:
          - mandatory

      sub_matrix:
        range: AtmosphericSubMatrix
        required: true
        in_subset:
          - mandatory

      sampling_method:
        range: AtmosphericSamplingMethod
        required: true
        in_subset:
          - mandatory

  # ---------------------------------------------------------------------------
  # SAMPLE AQUATIC
  # ---------------------------------------------------------------------------
  SampleAquatic:
    is_a: Sample
    description: A sample from the aquatic domain (water or sediment)
    attributes:

      matrix:
        range: AquaticMatrix
        required: true
        in_subset:
          - mandatory

      sub_matrix:
        range: AquaticSubMatrix
        required: true
        in_subset:
          - mandatory

      sampling_method:
        range: AquaticSamplingMethod
        required: true
        in_subset:
          - mandatory

      fraction:
        description: >-
          If the collected sample is divided into multiple fractions for
          separate analysis, this field identifies each subsample.
        range: AquaticFraction
        required: false

  # ---------------------------------------------------------------------------
  # SAMPLE TERRESTRIAL
  # ---------------------------------------------------------------------------
  SampleTerrestrial:
    is_a: Sample
    description: A sample from the terrestrial domain (soil)
    attributes:

      matrix:
        range: TerrestrialMatrix
        required: true
        in_subset:
          - mandatory

      sub_matrix:
        range: TerrestrialSubMatrix
        required: true
        in_subset:
          - mandatory

      sampling_method:
        # TODO: sampling_method for terrestrial samples is currently free-text
        # (range: string) unlike the atmospheric and aquatic counterparts which
        # use typed enums. A TerrestrialSamplingMethod enum should be defined
        # once the PARC community agrees on a controlled vocabulary.
        description: Sampling method for terrestrial samples
        range: string
        required: true
        in_subset:
          - mandatory

  # ---------------------------------------------------------------------------
  # SAMPLE BIOTA
  # ---------------------------------------------------------------------------
  SampleBiota:
    is_a: Sample
    description: A sample from the biota domain (plant or animal)
    attributes:

      matrix:
        range: BiotaMatrix
        required: true
        in_subset:
          - mandatory

      sub_matrix:
        range: BiotaSubMatrix
        required: true
        in_subset:
          - mandatory

      sampling_method:
        # TODO: Biota sampling method vocabulary to be discussed and agreed
        # with the PARC community. Currently free-text.
        description: Sampling method for biota samples (to be discussed)
        range: string
        required: false

      taxonomic_classification:
        description: >-
          Taxonomic classification of the organism.
          Source: https://www.ncbi.nlm.nih.gov/Taxonomy/
        range: string
        required: false

      compartment:
        description: >-
          The environmental compartment where the organism was sampled from.
        range: BiotaCompartment
        required: false
        multivalued: true

      gender:
        range: Gender
        required: false

      life_stage_age:
        description: Life stage or age of the organism
        range: string
        required: false

  # ---------------------------------------------------------------------------
  # MEASUREMENT CONCENTRATION
  # ---------------------------------------------------------------------------
  MeasurementConcentration:
    description: >-
      A measured concentration of a chemical compound in a sample.
      At least one of concentration, LOQ, or LOD must be provided.
    slots:
      - sample_id
      - unit
      - uncertainty
    attributes:

      laboratory:
        description: Name of the laboratory performing the analysis
        range: string
        required: true
        in_subset:
          - mandatory

      batch:
        description: >-
          Internal laboratory designation of the group of samples
          analyzed together
        range: string
        required: false

      analysis_date:
        description: The date on which the concentration was determined
        range: date
        required: false

      compound:
        description: >-
          Chemical compound measured in the sample.
          Reference to the PARC WP9 compound list entry (ChemicalCompound class).
          Identified by WP9_id, name, CAS, EC, InChI, and InChIKey.
          Mappable to ChEBI, PubChem, and NORMAN identifiers.
          # TODO: Decide whether multivalued: true is correct here.
          # A single measurement record should typically correspond to one compound.
          # Multivalued may be intentional for mixture records — confirm with domain experts.
        range: ChemicalCompound
        required: true
        multivalued: true
        in_subset:
          - mandatory

      sample_preparation_method:
        description: >-
          Description of the process from sample collection to chemical
          analysis (e.g., extraction, cleanup, fractionation).
        range: string
        required: true
        in_subset:
          - mandatory

      sample_preparation_method_link:
        description: >-
          GUPRI (e.g. DOI) linking to a public SOP, article, or other
          document describing the method.
        range: URIorCURIE
        required: false

      analysis_method:
        description: Analytical method used to determine the analyte
        range: AnalysisMethod
        required: true
        in_subset:
          - mandatory

      analysis_method_link:
        description: GUPRI linking to a public SOP or document describing the method
        range: URIorCURIE
        required: false

      data_handling_procedure:
        description: >-
          Steps taken after chemical analysis (e.g., blank correction,
          quality control, calibration, recovery, standardization,
          recalculations).
        range: string
        required: true
        in_subset:
          - mandatory

      data_handling_procedure_link:
        description: GUPRI linking to a document describing the data handling procedure
        range: URIorCURIE
        required: false

      concentration:
        description: >-
          Measured concentration value. At least one of concentration,
          LOQ, or LOD must be provided.
        range: double
        required: false

      loq:
        description: Limit of quantification
        range: double
        required: false

      lod:
        description: Limit of detection
        range: double
        required: false

    rules:
      - preconditions:
          slot_conditions:
            concentration:
              value_presence: ABSENT
            loq:
              value_presence: ABSENT
            lod:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            concentration:
              value_presence: PRESENT
        description: >-
          At least one of concentration, LOQ, or LOD must be provided.

  # ---------------------------------------------------------------------------
  # MEASUREMENT PARAMETER
  # ---------------------------------------------------------------------------
  MeasurementParameter:
    description: >-
      An additional parameter measured in the sample
      (e.g. pH, temperature, TOC). Depends on matrix type.
    slots:
      - sample_id
      - unit
      - uncertainty
    attributes:

      parameter:
        description: >-
          Name of the parameter measured. Refer to the
          codelist-parameter tab for the list.
        range: string
        required: true
        in_subset:
          - mandatory

      value:
        description: Measured value of the parameter
        range: double
        required: true
        in_subset:
          - mandatory
