  SoilTypeWRB:
    description: >-
      World Reference Base for Soil Resources (WRB) 2006/2007 Reference Soil Groups (RSGs).
      The WRB is the international standard for soil classification endorsed by the
      International Union of Soil Sciences (IUSS). The 2006/2007 edition is the version
      legally binding under INSPIRE.
    see_also:
      - https://www.fao.org/soils-portal/data-hub/soil-classification/world-reference-base/en/
      - https://www.isric.org/explore/wrb
    permissible_values:
      albeluvisols:
        description: >-
          Albeluvisols — soils with a clay-enriched subsoil and
          albic material intruding into the argic horizon.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Albeluvisols
      acrisols:
        description: >-
          Acrisols — strongly weathered soils with a clay-enriched subsoil
          and low base saturation.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Acrisols
      alisols:
        description: >-
          Alisols — strongly weathered soils with a clay-enriched subsoil,
          high aluminium saturation and high-activity clay.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Alisols
      andosols:
        description: >-
          Andosols — soils formed from volcanic materials with
          andic soil properties.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Andosols
      arenosols:
        description: >-
          Arenosols — sandy soils with little profile development.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Arenosols
      anthrosols:
        description: >-
          Anthrosols — soils profoundly modified by long-term human activities
          such as irrigation, addition of organic materials or deep cultivation.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Anthrosols
      calcisols:
        description: >-
          Calcisols — soils with substantial secondary accumulation of calcium carbonate.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Calcisols
      cambisols:
        description: >-
          Cambisols — moderately developed soils showing evidence of alteration
          in the subsoil.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Cambisols
      cryosols:
        description: >-
          Cryosols — soils affected by permafrost.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Cryosols
      durisols:
        description: >-
          Durisols — soils with substantial secondary accumulation of silica.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Durisols
      fluvisols:
        description: >-
          Fluvisols — young soils in fluvial, marine or lacustrine deposits.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Fluvisols
      ferralsols:
        description: >-
          Ferralsols — highly weathered soils dominated by kaolinite, oxides
          and hydroxides of iron and aluminium.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Ferralsols
      gleysols:
        description: >-
          Gleysols — soils with permanent or temporary waterlogging
          at shallow depth.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Gleysols
      gypsisols:
        description: >-
          Gypsisols — soils with substantial secondary accumulation of gypsum.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Gypsisols
      histosols:
        description: >-
          Histosols — organic soils (peat soils and mucks).
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Histosols
      chernozems:
        description: >-
          Chernozems — soils with a thick, dark, humus-rich topsoil
          and high base saturation.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Chernozems
      kastanozems:
        description: >-
          Kastanozems — soils with a dark brown, humus-rich topsoil
          and secondary carbonate accumulation in drier conditions than Chernozems.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Kastanozems
      leptosols:
        description: >-
          Leptosols — very shallow soils over hard rock or with
          extremely gravelly material.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Leptosols
      luvisols:
        description: >-
          Luvisols — soils with a clay-enriched subsoil and
          high base saturation with high-activity clay.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Luvisols
      lixisols:
        description: >-
          Lixisols — soils with a clay-enriched subsoil and
          high base saturation with low-activity clay.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Lixisols
      nitisols:
        description: >-
          Nitisols — deep, well-drained, red, tropical soils with
          a nitic horizon.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Nitisols
      phaeozems:
        description: >-
          Phaeozems — soils with a dark, humus-rich topsoil and
          high base saturation in more humid conditions than Chernozems.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Phaeozems
      planosols:
        description: >-
          Planosols — soils with an abrupt textural change to a slowly
          permeable subsoil causing periodic waterlogging.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Planosols
      plinthosols:
        description: >-
          Plinthosols — soils with plinthite, petroplinthite or pisoplinthite
          near the surface.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Plinthosols
      podzols:
        description: >-
          Podzols — soils with a subsoil accumulation of organic matter
          and aluminium and/or iron.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Podzols
      regosols:
        description: >-
          Regosols — soils with no significant profile development
          other than an ochric topsoil.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Regosols
      solonchaks:
        description: >-
          Solonchaks — soils with a high concentration of soluble salts.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Solonchaks
      solonetz:
        description: >-
          Solonetz — soils with a natric horizon with high sodium saturation.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Solonetz
      stagnosols:
        description: >-
          Stagnosols — soils with periodic surface waterlogging due to
          a slowly permeable layer.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Stagnosols
      technosols:
        description: >-
          Technosols — soils whose properties and pedogenesis are dominated
          by technical material of human origin.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Technosols
      umbrisols:
        description: >-
          Umbrisols — soils with a dark, acidic, humus-rich topsoil
          and low base saturation.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Umbrisols
      vertisols:
        description: >-
          Vertisols — clay-rich soils with high shrink-swell capacity,
          forming wide cracks when dry.
        meaning: http://w3id.org/glosis/model/codelists/wrb2006rsgCode-Vertisols
 
